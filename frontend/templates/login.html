<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
            background:#f4f6f9;
        }
        .login-box {
            background:white;
            padding:30px;
            border-radius:8px;
            width:300px;
            box-shadow:0 4px 12px rgba(0,0,0,.1);
        }
        input, button {
            width:100%;
            padding:10px;
            margin-top:10px;
        }
        button {
            background:#0d6efd;
            color:white;
            border:none;
            cursor:pointer;
        }
        .error { color:red; }
    </style>
</head>
<body>
    <form class="login-box" method="POST">
        <h2>Admin Login</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button>Login</button>
    </form>
</body>
</html>
